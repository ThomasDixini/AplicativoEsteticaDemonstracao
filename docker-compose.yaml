services:
  db:
    ports:
      - "5432:5432"
    networks:
      - backend-network
    image: postgres:latest
    environment:  
      - POSTGRES_USER=${DB_POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=estetica_db
  backend:
    networks:
      - backend-network
    build: ./backend
    expose:
      - "5056"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5056
      - ASPNETCORE_ENVIRONMENT=Development
      - AppConfig__ApiUrl=http://backend:5056
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=estetica_db;Username=${DB_POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    volumes:
      - ./app-data:/app/EsteticaAPI/wwwroot
    depends_on:
      - db
  mobile:
    networks:
      - mobile-network
    build: ./mobile
    ports:
      - "8081:8081"
    environment:
      - EXPO_PUBLIC_API_APP_URL=${EXPO_PUBLIC_API_APP_URL}
      - EXPO_PUBLIC_API_WEB_URL=${EXPO_PUBLIC_API_WEB_URL}
      - EXPO_PUBLIC_WHATSAPP=${EXPO_PUBLIC_WHATSAPP}
      - EXPO_PUBLIC_FACEBOOK_URL=${EXPO_PUBLIC_FACEBOOK_URL}
      - EXPO_PUBLIC_INSTAGRAM_URL=${EXPO_PUBLIC_INSTAGRAM_URL}
    volumes:
      - ./mobile-data:/usr/src/app/public
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    networks:
      - backend-network
      - mobile-network
    container_name: nginx
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./app-data:/app/EsteticaAPI/wwwroot
    depends_on:
      - backend
networks:
  backend-network:
    driver: bridge
  mobile-network:
    driver: bridge